name: CI
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.7-alpine
        env:
          POSTGRES_USER: ft_test
          POSTGRES_PASSWORD: synthetic-test-only
          POSTGRES_DB: financialtracker_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ft_test -d financialtracker_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_HOST: 127.0.0.1
      DATABASE_NAME: financialtracker_test
      DATABASE_USER: ft_test
      DATABASE_PASSWORD: synthetic-test-only
      TEST_DATABASE_URL: postgresql+psycopg://ft_test:synthetic-test-only@127.0.0.1:5432/financialtracker_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - run: alembic check
      - name: Check public NBP network separately
        continue-on-error: true
        run: python -m tests.network_nbp
      - name: Check public bond and GUS sources separately
        continue-on-error: true
        run: python -m tests.network_bond_sources
      - name: Check public Yahoo network separately
        continue-on-error: true
        run: python -m tests.network_yahoo

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Start complete application
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose up --build -d --wait --wait-timeout 180
          docker compose exec -T backend python -m app.seed
          docker compose exec -T backend python -m app.seed
          node scripts/smoke.mjs
          node scripts/smoke-purchases.mjs create
          node scripts/smoke-valuation.mjs create
          node scripts/smoke-bonds.mjs create
          node scripts/smoke-stocks.mjs create
          node scripts/smoke-portfolio.mjs create
          node scripts/smoke-groups.mjs create
          docker compose exec -T -e YAHOO_SYNTHETIC_SMOKE=1 backend python -m tests.seed_yahoo_smoke
          node scripts/smoke-yahoo.mjs
      - name: Check persistence after restart
        run: |
          docker compose restart db backend frontend
          node scripts/smoke.mjs
          node scripts/smoke-purchases.mjs verify
          node scripts/smoke-valuation.mjs verify
          node scripts/smoke-bonds.mjs verify
          node scripts/smoke-stocks.mjs verify
          node scripts/smoke-portfolio.mjs verify
          node scripts/smoke-groups.mjs verify
          node scripts/smoke-yahoo.mjs
      - name: Check database outage and recovery
        run: |
          docker compose stop db
          node scripts/smoke.mjs unavailable
          docker compose start db
          node scripts/smoke.mjs
      - name: Check prebuilt-image deployment on the existing data volume
        env:
          APP_VERSION: sha-${{ github.sha }}
          IMAGE_PREFIX: ghcr.io/grotejongen/financialtracker
        run: |
          bash scripts/build-images.sh
          node scripts/check-ghcr.mjs
          docker compose --env-file .env -f compose.ghcr.yaml up --no-build --pull never -d --wait --wait-timeout 180
          node scripts/smoke.mjs
          node scripts/smoke-purchases.mjs verify
          node scripts/smoke-valuation.mjs verify
          node scripts/smoke-bonds.mjs verify
          node scripts/smoke-stocks.mjs verify
          node scripts/smoke-portfolio.mjs verify
          node scripts/smoke-groups.mjs verify
      - name: Check manual updater failure handling without Docker or user data
        shell: pwsh
        run: ./scripts/tests/update.tests.ps1
      - name: Run browser tests
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Diagnostics on failure
        if: failure()
        run: docker compose ps -a
      - name: Stop services, preserve data volume
        if: always()
        run: docker compose --profile test down

  publish-images:
    name: publish-images
    needs: [backend, frontend, compose]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      COMPOSE_PROJECT_NAME: financialtracker-release-ci
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Select one release for both images
        shell: bash
        run: |
          printf 'APP_VERSION=sha-%s\nIMAGE_PREFIX=ghcr.io/%s\n' "$GITHUB_SHA" "${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Build the images that will be published
        run: bash scripts/build-images.sh
      - name: Verify the exact images before uploading
        run: |
          docker compose --env-file .env.example -f compose.ghcr.yaml pull db
          docker compose --env-file .env.example -f compose.ghcr.yaml up --no-build --pull never -d --wait --wait-timeout 180
          docker compose --env-file .env.example -f compose.ghcr.yaml exec -T backend python -m app.seed
          node scripts/smoke.mjs
      - name: Log in to GHCR using the job token
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish both images
        run: |
          docker push "$IMAGE_PREFIX-backend:$APP_VERSION"
          docker push "$IMAGE_PREFIX-frontend:$APP_VERSION"
      - name: Show the published release
        run: |
          {
            printf '## GHCR release `%s`\n\n' "$APP_VERSION"
            printf -- '- Backend: `%s-backend:%s`\n' "$IMAGE_PREFIX" "$APP_VERSION"
            printf -- '- Frontend: `%s-frontend:%s`\n\n' "$IMAGE_PREFIX" "$APP_VERSION"
            printf 'Manual download: `./scripts/update.ps1 -Version %s -PullOnly`\n\n' "$APP_VERSION"
            printf 'Manual update: `./scripts/update.ps1 -Version %s`\n' "$APP_VERSION"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Stop isolated verification services
        if: always()
        run: docker compose --env-file .env.example -f compose.ghcr.yaml down
      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io
