name: CI
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.7-alpine
        env:
          POSTGRES_USER: ft_test
          POSTGRES_PASSWORD: synthetic-test-only
          POSTGRES_DB: financialtracker_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ft_test -d financialtracker_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_HOST: 127.0.0.1
      DATABASE_NAME: financialtracker_test
      DATABASE_USER: ft_test
      DATABASE_PASSWORD: synthetic-test-only
      TEST_DATABASE_URL: postgresql+psycopg://ft_test:synthetic-test-only@127.0.0.1:5432/financialtracker_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - run: alembic check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Start complete application
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose up --build -d --wait --wait-timeout 180
          docker compose exec -T backend python -m app.seed
          docker compose exec -T backend python -m app.seed
          node scripts/smoke.mjs
          node scripts/smoke-purchases.mjs create
          node scripts/smoke-valuation.mjs create
      - name: Check persistence after restart
        run: |
          docker compose restart db backend frontend
          node scripts/smoke.mjs
          node scripts/smoke-purchases.mjs verify
          node scripts/smoke-valuation.mjs verify
      - name: Check database outage and recovery
        run: |
          docker compose stop db
          node scripts/smoke.mjs unavailable
          docker compose start db
          node scripts/smoke.mjs
      - name: Check actual browser connection and mobile layout
        run: docker compose exec -T backend python -m tests.seed_browser
      - name: Run browser tests
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Diagnostics on failure
        if: failure()
        run: docker compose ps -a
      - name: Stop services, preserve data volume
        if: always()
        run: docker compose --profile test down
