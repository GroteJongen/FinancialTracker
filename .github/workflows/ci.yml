name: CI
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Jednorazowy bootstrap w FT-001. Po zapisaniu lockfile zostanie usunięty.
  dependencies:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.result.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Resolve dependencies and format initial Python code
        run: |
          if [ ! -f frontend/package-lock.json ]; then
            (cd frontend && npm install --package-lock-only --ignore-scripts)
          fi
          if [ ! -f backend/requirements.lock ]; then
            python -m pip install 'uv==0.9.10'
            uv pip compile backend/requirements.in --generate-hashes --python-version 3.13 -o backend/requirements.lock
          fi
          python -m pip install --require-hashes -r backend/requirements.lock
          ruff check --fix backend
          ruff format backend
          git add frontend/package-lock.json backend
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build: lock dependencies and format initial Python code'
            git push origin HEAD:${{ github.ref_name }}
          fi
      - id: result
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  backend:
    needs: dependencies
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.7-alpine
        env:
          POSTGRES_USER: ft_test
          POSTGRES_PASSWORD: synthetic-test-only
          POSTGRES_DB: financialtracker_test
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U ft_test -d financialtracker_test'
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_HOST: 127.0.0.1
      DATABASE_NAME: financialtracker_test
      DATABASE_USER: ft_test
      DATABASE_PASSWORD: synthetic-test-only
      TEST_DATABASE_URL: postgresql+psycopg://ft_test:synthetic-test-only@127.0.0.1:5432/financialtracker_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.dependencies.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - run: alembic check

  frontend:
    needs: dependencies
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.dependencies.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  compose:
    needs: dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.dependencies.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Start complete application
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose up --build -d --wait --wait-timeout 180
          docker compose exec -T backend python -m app.seed
          docker compose exec -T backend python -m app.seed
          node scripts/smoke.mjs
      - name: Check persistence after restart
        run: |
          docker compose restart db backend frontend
          node scripts/smoke.mjs
      - name: Check database outage and recovery
        run: |
          docker compose stop db
          node scripts/smoke.mjs unavailable
          docker compose start db
          node scripts/smoke.mjs
      - name: Check actual browser connection and mobile layout
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Diagnostics on failure
        if: failure()
        run: docker compose ps -a
      - name: Stop services, preserve data volume
        if: always()
        run: docker compose --profile test down
